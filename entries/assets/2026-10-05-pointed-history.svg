<path d="M 58 26 C 78 22, 92 24, 104 30 C 118 20, 130 22, 142 30 L 188 34 Q 202 34, 202 44 Q 202 54, 188 54 L 146 56 C 134 58, 126 64, 126 74 Q 126 84, 116 84 Q 106 84, 106 76 Q 106 88, 96 88 Q 86 88, 86 80 Q 86 92, 76 92 Q 66 92, 66 82 C 62 88, 60 90, 58 92 Z" fill="#3a3126"/>
