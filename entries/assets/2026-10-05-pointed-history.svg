<text x="600.0" y="100" text-anchor="middle" font-size="44" letter-spacing="6" fill="#3a3126">A POINTED HISTORY</text>
<text x="600.0" y="134" text-anchor="middle" font-size="19" font-style="italic" fill="#5c4f3b">eight centuries of the printer&apos;s fist &amp; its companions in the margins</text>
<rect x="76" y="170" width="344" height="372" rx="10" fill="#faf4e6" stroke="#8a7a5c" stroke-width="1.5"/>
<rect x="84" y="178" width="328" height="356" rx="6" fill="none" stroke="#8a7a5c" stroke-width="0.6" opacity="0.7"/>
<g transform="translate(148.0,238.0) scale(1.0)">
