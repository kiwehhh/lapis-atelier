<path d="M 104 74 C 96 66, 92 56, 96 48 C 100 42, 108 44, 110 52 C 112 60, 110 68, 104 74 Z" fill="none" stroke="#5c4f3b" stroke-width="5"/>
</g>
<text x="248.0" y="376" text-anchor="middle" font-size="21" letter-spacing="3" fill="#3a3126">THE MANICULE</text>
<text x="248.0" y="402" text-anchor="middle" font-size="15" font-style="italic" fill="#5c4f3b">the printer's fist</text>
<text x="248.0" y="430" text-anchor="middle" font-size="14.5" fill="#5c4f3b">Latin manicula, “little hand”.</text>
<text x="248.0" y="449" text-anchor="middle" font-size="14.5" fill="#5c4f3b">Readers have drawn fingers in book</text>
<text x="248.0" y="468" text-anchor="middle" font-size="14.5" fill="#5c4f3b">margins since the 12th century — the</text>
<text x="248.0" y="487" text-anchor="middle" font-size="14.5" fill="#5c4f3b">medieval highlighter, later adopted by</text>
<text x="248.0" y="506" text-anchor="middle" font-size="14.5" fill="#5c4f3b">printers and advertisers.</text>
<rect x="440" y="170" width="344" height="372" rx="10" fill="#faf4e6" stroke="#8a7a5c" stroke-width="1.5"/>
<rect x="448" y="178" width="328" height="356" rx="6" fill="none" stroke="#8a7a5c" stroke-width="0.6" opacity="0.7"/>
<text x="612.0" y="336" text-anchor="middle" font-size="100" fill="#3a3126" font-family="Georgia, 'DejaVu Serif', serif">¶</text>
<path d="M 522.0 304 q 30 -14, 60 -4" fill="none" stroke="#8a7a5c" stroke-width="1.5"/>
<path d="M 702.0 304 q -30 -14, -60 -4" fill="none" stroke="#8a7a5c" stroke-width="1.5"/>
<circle cx="516.0" cy="306" r="3" fill="#8a7a5c"/>
<circle cx="708.0" cy="306" r="3" fill="#8a7a5c"/>
<text x="612.0" y="376" text-anchor="middle" font-size="21" letter-spacing="3" fill="#3a3126">THE PILCROW</text>
<text x="612.0" y="402" text-anchor="middle" font-size="15" font-style="italic" fill="#5c4f3b">the paragraph's ghost</text>
<text x="612.0" y="430" text-anchor="middle" font-size="14.5" fill="#5c4f3b">Descended from a capital C for</text>
<text x="612.0" y="449" text-anchor="middle" font-size="14.5" fill="#5c4f3b">capitulum, “head” of a chapter. It</text>
<text x="612.0" y="468" text-anchor="middle" font-size="14.5" fill="#5c4f3b">marked new paragraphs for centuries</text>
<text x="612.0" y="487" text-anchor="middle" font-size="14.5" fill="#5c4f3b">before retreating to legal documents</text>
<text x="612.0" y="506" text-anchor="middle" font-size="14.5" fill="#5c4f3b">and word processors.</text>
<rect x="804" y="170" width="344" height="372" rx="10" fill="#faf4e6" stroke="#8a7a5c" stroke-width="1.5"/>
<rect x="812" y="178" width="328" height="356" rx="6" fill="none" stroke="#8a7a5c" stroke-width="0.6" opacity="0.7"/>
<path d="M 976.0 256 C 930.0 262, 928.0 296, 958.0 308 C 967.0 312, 975.0 306, 976.0 298 Z" fill="#3a3126"/>
<path d="M 976.0 256 C 1022.0 262, 1024.0 296, 994.0 308 C 985.0 312, 977.0 306, 976.0 298 Z" fill="#3a3126"/>
<path d="M 976.0 310 q -16 16, -2 26 q 11 8, 19 -2 q 6 -8, -2 -14" fill="none" stroke="#3a3126" stroke-width="6.5" stroke-linecap="round"/>
<path d="M 976.0 256 L 976.0 304" stroke="#faf4e6" stroke-width="3"/>
<circle cx="976.0" cy="248" r="5.5" fill="#3a3126"/>
<text x="976.0" y="376" text-anchor="middle" font-size="21" letter-spacing="3" fill="#3a3126">THE FLEURON</text>
<text x="976.0" y="402" text-anchor="middle" font-size="15" font-style="italic" fill="#5c4f3b">the printer's flower</text>
<text x="976.0" y="430" text-anchor="middle" font-size="14.5" fill="#5c4f3b">A leafy typographic bouquet used to</text>
<text x="976.0" y="449" text-anchor="middle" font-size="14.5" fill="#5c4f3b">divide chapters and grace title pages</text>
<text x="976.0" y="468" text-anchor="middle" font-size="14.5" fill="#5c4f3b">— the print shop's way of tucking</text>
<text x="976.0" y="487" text-anchor="middle" font-size="14.5" fill="#5c4f3b">flowers behind a heading.</text>
<rect x="76" y="562" width="344" height="372" rx="10" fill="#faf4e6" stroke="#8a7a5c" stroke-width="1.5"/>
<rect x="84" y="570" width="328" height="356" rx="6" fill="none" stroke="#8a7a5c" stroke-width="0.6" opacity="0.7"/>
<path d="M 244.0 636 C 208.0 634, 202.0 666, 224.0 674 C 238.0 680, 246.0 680, 246.0 690 L 246.0 702" fill="none" stroke="#3a3126" stroke-width="13" stroke-linecap="round"/>
<circle cx="246.0" cy="720" r="8.5" fill="#3a3126"/>
<text x="248.0" y="768" text-anchor="middle" font-size="21" letter-spacing="3" fill="#3a3126">THE INTERROBANG</text>
<text x="248.0" y="794" text-anchor="middle" font-size="15" font-style="italic" fill="#5c4f3b">the 1962 upstart</text>
<text x="248.0" y="822" text-anchor="middle" font-size="14.5" fill="#5c4f3b">Martin K. Speckter fused ? and ! to</text>
<text x="248.0" y="841" text-anchor="middle" font-size="14.5" fill="#5c4f3b">express incredulity — a rhetorical</text>
<text x="248.0" y="860" text-anchor="middle" font-size="14.5" fill="#5c4f3b">mark for when neither question nor</text>
<text x="248.0" y="879" text-anchor="middle" font-size="14.5" fill="#5c4f3b">shout will do. Rarely used, beloved by</text>
<text x="248.0" y="898" text-anchor="middle" font-size="14.5" fill="#5c4f3b">all who meet it.</text>
<rect x="440" y="562" width="344" height="372" rx="10" fill="#faf4e6" stroke="#8a7a5c" stroke-width="1.5"/>
<rect x="448" y="570" width="328" height="356" rx="6" fill="none" stroke="#8a7a5c" stroke-width="0.6" opacity="0.7"/>
<text x="612.0" y="728" text-anchor="middle" font-size="100" fill="#3a3126" font-family="Georgia, 'DejaVu Serif', serif">†</text>
<path d="M 522.0 696 q 30 -14, 60 -4" fill="none" stroke="#8a7a5c" stroke-width="1.5"/>
<path d="M 702.0 696 q -30 -14, -60 -4" fill="none" stroke="#8a7a5c" stroke-width="1.5"/>
<circle cx="516.0" cy="698" r="3" fill="#8a7a5c"/>
<circle cx="708.0" cy="698" r="3" fill="#8a7a5c"/>
<text x="612.0" y="768" text-anchor="middle" font-size="21" letter-spacing="3" fill="#3a3126">THE OBELUS</text>
<text x="612.0" y="794" text-anchor="middle" font-size="15" font-style="italic" fill="#5c4f3b">the scholar's spit</text>
<text x="612.0" y="822" text-anchor="middle" font-size="14.5" fill="#5c4f3b">Alexandrian scholars marked doubtful</text>
<text x="612.0" y="841" text-anchor="middle" font-size="14.5" fill="#5c4f3b">lines of Homer with this “spit” or</text>
<text x="612.0" y="860" text-anchor="middle" font-size="14.5" fill="#5c4f3b">dagger. It survives as the footnote's</text>
<text x="612.0" y="879" text-anchor="middle" font-size="14.5" fill="#5c4f3b">second-in-command, forever under the</text>
<text x="612.0" y="898" text-anchor="middle" font-size="14.5" fill="#5c4f3b">asterisk's thumb.</text>
<rect x="804" y="562" width="344" height="372" rx="10" fill="#faf4e6" stroke="#8a7a5c" stroke-width="1.5"/>
<rect x="812" y="570" width="328" height="356" rx="6" fill="none" stroke="#8a7a5c" stroke-width="0.6" opacity="0.7"/>
<text x="976.0" y="728" text-anchor="middle" font-size="100" fill="#3a3126" font-family="Georgia, 'DejaVu Serif', serif">⁂</text>
<path d="M 886.0 696 q 30 -14, 60 -4" fill="none" stroke="#8a7a5c" stroke-width="1.5"/>
<path d="M 1066.0 696 q -30 -14, -60 -4" fill="none" stroke="#8a7a5c" stroke-width="1.5"/>
<circle cx="880.0" cy="698" r="3" fill="#8a7a5c"/>
<circle cx="1072.0" cy="698" r="3" fill="#8a7a5c"/>
<text x="976.0" y="768" text-anchor="middle" font-size="21" letter-spacing="3" fill="#3a3126">THE ASTERISKOS</text>
<text x="976.0" y="794" text-anchor="middle" font-size="15" font-style="italic" fill="#5c4f3b">the original star</text>
<text x="976.0" y="822" text-anchor="middle" font-size="14.5" fill="#5c4f3b">Ancient editors used this triple star</text>
<text x="976.0" y="841" text-anchor="middle" font-size="14.5" fill="#5c4f3b">to flag duplicated passages — three</text>
<text x="976.0" y="860" text-anchor="middle" font-size="14.5" fill="#5c4f3b">points of light in the margin, the</text>
<text x="976.0" y="879" text-anchor="middle" font-size="14.5" fill="#5c4f3b">asterisk's aristocratic ancestor.</text>
<circle cx="581" cy="942" r="1.6" fill="#8a7a5c" opacity="0.5"/>
<circle cx="1021" cy="929" r="2.2" fill="#8a7a5c" opacity="0.5"/>
<circle cx="440" cy="932" r="1.6" fill="#8a7a5c" opacity="0.5"/>
<circle cx="681" cy="919" r="2.0" fill="#8a7a5c" opacity="0.5"/>
<circle cx="946" cy="932" r="1.7" fill="#8a7a5c" opacity="0.5"/>
<circle cx="89" cy="937" r="1.4" fill="#8a7a5c" opacity="0.5"/>
<circle cx="146" cy="915" r="1.4" fill="#8a7a5c" opacity="0.5"/>
<circle cx="178" cy="925" r="2.0" fill="#8a7a5c" opacity="0.5"/>
<circle cx="706" cy="922" r="1.4" fill="#8a7a5c" opacity="0.5"/>
<circle cx="986" cy="935" r="1.6" fill="#8a7a5c" opacity="0.5"/>
<circle cx="338" cy="943" r="1.8" fill="#8a7a5c" opacity="0.5"/>
<circle cx="990" cy="917" r="1.7" fill="#8a7a5c" opacity="0.5"/>
<text x="600.0" y="976" text-anchor="middle" font-size="15" font-style="italic" fill="#5c4f3b">drawn procedurally in SVG — every hand, cuff, and flourish placed by code, in the 7am hour</text>
</svg>