<ellipse cx="730" cy="270" rx="40" ry="28" fill="none" stroke="#f7efdb" stroke-width="1.6"/>
<text x="730" y="278" font-family="Georgia, serif" font-size="24" text-anchor="middle" font-weight="bold" fill="#f7efdb">ʘǝʍs</text>
<text x="890" y="265" font-family="Georgia, serif" font-size="18" text-anchor="start" font-weight="normal" fill="#2e2a24">carved in reverse —</text>
<text x="890" y="290" font-family="Georgia, serif" font-size="18" font-style="italic" text-anchor="start" font-weight="normal" fill="#2e2a24">intaglio in a hard gem</text>
<text x="890" y="340" font-family="Georgia, serif" font-size="18" text-anchor="start" font-weight="normal" fill="#2e2a24">reads correctly</text>
<text x="890" y="365" font-family="Georgia, serif" font-size="18" font-style="italic" text-anchor="start" font-weight="normal" fill="#2e2a24">only in the impression</text>
<polygon points="972,455 964,476 951,494 932,506 909,502 888,495 873,478 872,455 874,433 887,413 909,406 932,402 953,414 964,434" fill="#9e2b25" stroke="#2e2a24" stroke-width="1.6"/>
<circle cx="920" cy="455" r="35" fill="none" stroke="#f7efdb" stroke-width="1.6" opacity="0.75"/>
<circle cx="920" cy="455" r="16" fill="none" stroke="#f7efdb" stroke-width="1.2" opacity="0.6"/>
<text x="920" y="450" font-family="Georgia, serif" font-size="22" text-anchor="middle" font-weight="bold" fill="#f7efdb">S:</text>
<text x="650" y="535" font-family="Georgia, serif" font-size="17" font-style="italic" text-anchor="start" font-weight="normal" fill="#2e2a24">Egypt: signet rings bearing kings’ names</text>
<text x="560" y="612" font-family="Georgia, serif" font-size="20" text-anchor="start" font-weight="normal" fill="#2e2a24">B · Your signature, worn on your hand —</text>
<text x="560" y="637" font-family="Georgia, serif" font-size="20" text-anchor="start" font-weight="normal" fill="#2e2a24">and legible only once you’ve pressed it down.</text>
<rect x="1050" y="150" width="480" height="430" fill="none" stroke="#2e2a24" stroke-width="2.5"/>
<rect x="1058" y="158" width="464" height="414" fill="none" stroke="#2e2a24" stroke-width="1" opacity="0.5"/>
<text x="1072" y="188" font-family="Georgia, serif" font-size="25" text-anchor="start" font-weight="bold" fill="#2e2a24">C · Hanging Authority</text>
