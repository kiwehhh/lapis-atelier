<text x="1230" y="468" font-family="Georgia, serif" font-size="17" font-style="italic" text-anchor="middle" font-weight="normal" fill="#f7efdb">king</text>
<text x="1230" y="490" font-family="Georgia, serif" font-size="15" font-style="italic" text-anchor="middle" font-weight="normal" fill="#f7efdb"> enthroned</text>
