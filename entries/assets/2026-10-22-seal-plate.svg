<text x="1415" y="450" font-family="Georgia, serif" font-size="26" text-anchor="middle" font-weight="normal" fill="#f7efdb">✦</text>
<text x="1415" y="525" font-family="Georgia, serif" font-size="16" text-anchor="middle" font-weight="normal" fill="#2e2a24">vesica: pointed oval</text>
<text x="1415" y="546" font-family="Georgia, serif" font-size="16" font-style="italic" text-anchor="middle" font-weight="normal" fill="#2e2a24">women &amp; churchmen</text>
