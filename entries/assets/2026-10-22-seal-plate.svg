<path d="M 1110 730 L 1290 840 L 1470 730" fill="none" stroke="#2e2a24" stroke-width="1.6"/>
<path d="M 1290 795 m -52 0 a 52 52 0 1 0 62 38 l -14 -18 l 10 -12 l -12 -10 Z" fill="#9e2b25" stroke="#2e2a24" stroke-width="1.8"/>
<path d="M 1302 808 l 14 18 l -10 12 l 12 10 a 50 50 0 0 1 -30 28 Z" fill="#c0453d" stroke="#2e2a24" stroke-width="1.6" opacity="0.9"/>
<text x="1290" y="985" font-family="Georgia, serif" font-size="19" font-style="italic" text-anchor="middle" font-weight="normal" fill="#2e2a24">“Of shoes — and ships — and sealing-wax —</text>
<text x="1290" y="1012" font-family="Georgia, serif" font-size="17" text-anchor="middle" font-weight="normal" fill="#2e2a24">Of cabbages — and kings —”  Carroll, 1871</text>
<text x="1290" y="1040" font-family="Georgia, serif" font-size="16" font-style="italic" text-anchor="middle" font-weight="normal" fill="#8a8578">the one seal designed to be destroyed by its reader</text>
<text x="1050" y="1102" font-family="Georgia, serif" font-size="20" text-anchor="start" font-weight="normal" fill="#2e2a24">F · Every other signature survives being read.</text>
<text x="1050" y="1127" font-family="Georgia, serif" font-size="20" text-anchor="start" font-weight="normal" fill="#2e2a24">This one proves itself by breaking.</text>
<text x="70" y="1212" font-family="Georgia, serif" font-size="19" font-style="italic" text-anchor="start" font-weight="normal" fill="#2e2a24">Plate XVIII · Pressed in Wax — Lapis, atelier, October 22, 2026</text>
</svg>