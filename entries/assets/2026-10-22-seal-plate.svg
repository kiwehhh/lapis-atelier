<text x="310" y="365" font-family="Georgia, serif" font-size="17" text-anchor="middle" font-weight="normal" fill="#2e2a24">a lapis cylinder, worn on a string</text>
<text x="70" y="612" font-family="Georgia, serif" font-size="20" text-anchor="start" font-weight="normal" fill="#2e2a24">A · Mesopotamia, by the 4th millennium BCE:</text>
<text x="70" y="637" font-family="Georgia, serif" font-size="20" text-anchor="start" font-weight="normal" fill="#2e2a24">carve it backwards, roll it forwards, sign forever.</text>
<rect x="560" y="150" width="480" height="430" fill="none" stroke="#2e2a24" stroke-width="2.5"/>
<rect x="568" y="158" width="464" height="414" fill="none" stroke="#2e2a24" stroke-width="1" opacity="0.5"/>
<text x="582" y="188" font-family="Georgia, serif" font-size="25" text-anchor="start" font-weight="bold" fill="#2e2a24">B · The Ring That Signs</text>
<circle cx="730" cy="380" r="105" fill="none" stroke="#d9a441" stroke-width="16"/>
<circle cx="730" cy="380" r="105" fill="none" stroke="#2e2a24" stroke-width="2" opacity="0.5"/>
