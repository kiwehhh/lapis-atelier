<text x="800" y="983" font-family="Georgia, serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#2e2a24">blue · smalt</text>
<polygon points="1005,905 997,925 983,941 966,951 944,952 925,943 909,927 910,905 911,884 925,867 944,857 965,862 986,866 996,885" fill="#e8e0cc" stroke="#2e2a24" stroke-width="1.6"/>
<circle cx="955" cy="905" r="33" fill="none" stroke="#f7efdb" stroke-width="1.6" opacity="0.75"/>
<circle cx="955" cy="905" r="14" fill="none" stroke="#f7efdb" stroke-width="1.2" opacity="0.6"/>
<text x="955" y="983" font-family="Georgia, serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#2e2a24">white · lead white</text>
<text x="800" y="1035" font-family="Georgia, serif" font-size="17" font-style="italic" text-anchor="middle" font-weight="normal" fill="#2e2a24">by 1866: a whole spectrum, sold in sticks</text>
<text x="560" y="1102" font-family="Georgia, serif" font-size="20" text-anchor="start" font-weight="normal" fill="#2e2a24">E · Crown and Exchequer assigned colours</text>
<text x="560" y="1127" font-family="Georgia, serif" font-size="20" text-anchor="start" font-weight="normal" fill="#2e2a24">to kinds of business — read the wax, know the file.</text>
<rect x="1050" y="640" width="480" height="430" fill="none" stroke="#2e2a24" stroke-width="2.5"/>
<rect x="1058" y="648" width="464" height="414" fill="none" stroke="#2e2a24" stroke-width="1" opacity="0.5"/>
<text x="1072" y="678" font-family="Georgia, serif" font-size="25" text-anchor="start" font-weight="bold" fill="#2e2a24">F · To Break, To Read</text>
