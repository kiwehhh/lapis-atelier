<circle cx="1435" cy="300" r="32" fill="none" stroke="#2e2a24" stroke-width="1.2"/>
<text x="1435" y="365" font-family="Georgia, serif" font-size="15" font-style="italic" text-anchor="middle" font-weight="normal" fill="#2e2a24">skippet — its little tin box</text>
<text x="1050" y="612" font-family="Georgia, serif" font-size="20" text-anchor="start" font-weight="normal" fill="#2e2a24">C · The great seal dangles below the deed —</text>
<text x="1050" y="637" font-family="Georgia, serif" font-size="20" text-anchor="start" font-weight="normal" fill="#2e2a24">authority you can weigh in your palm.</text>
<rect x="70" y="640" width="480" height="430" fill="none" stroke="#2e2a24" stroke-width="2.5"/>
<rect x="78" y="648" width="464" height="414" fill="none" stroke="#2e2a24" stroke-width="1" opacity="0.5"/>
<text x="92" y="678" font-family="Georgia, serif" font-size="25" text-anchor="start" font-weight="bold" fill="#2e2a24">D · The Recipe That Lost Its Wax</text>
<text x="100" y="725" font-family="Georgia, serif" font-size="17" text-anchor="start" font-weight="bold" fill="#8a8578">MEDIEVAL</text>
<text x="100" y="752" font-family="Georgia, serif" font-size="19" text-anchor="start" font-weight="normal" fill="#2e2a24">beeswax + Venice turpentine</text>
<text x="100" y="777" font-family="Georgia, serif" font-size="19" text-anchor="start" font-weight="normal" fill="#2e2a24">(larch resin), coloured red</text>
<text x="100" y="802" font-family="Georgia, serif" font-size="19" font-style="italic" text-anchor="start" font-weight="normal" fill="#2e2a24">with vermilion</text>
<text x="100" y="845" font-family="Georgia, serif" font-size="17" text-anchor="start" font-weight="bold" fill="#9e2b25">FINE RED, 1911 FORMULA — NO WAX AT ALL</text>
<text x="100" y="880" font-family="Georgia, serif" font-size="18" text-anchor="start" font-weight="normal" fill="#2e2a24">shellac</text>
<rect x="265" y="859" width="224" height="24" fill="#2b4a8a" stroke="#2e2a24"/>
<text x="499" y="880" font-family="Georgia, serif" font-size="17" text-anchor="start" font-weight="normal" fill="#2e2a24">7 parts</text>
<text x="100" y="932" font-family="Georgia, serif" font-size="18" text-anchor="start" font-weight="normal" fill="#2e2a24">Venice turpentine</text>
<rect x="265" y="911" width="128" height="24" fill="#d9a441" stroke="#2e2a24"/>
<text x="403" y="932" font-family="Georgia, serif" font-size="17" text-anchor="start" font-weight="normal" fill="#2e2a24">4 parts</text>
<text x="100" y="984" font-family="Georgia, serif" font-size="18" text-anchor="start" font-weight="normal" fill="#2e2a24">vermilion</text>
<rect x="265" y="963" width="112" height="24" fill="#9e2b25" stroke="#2e2a24"/>
<text x="387.0" y="984" font-family="Georgia, serif" font-size="17" text-anchor="start" font-weight="normal" fill="#2e2a24">3.5 parts</text>
<text x="100" y="1045" font-family="Georgia, serif" font-size="17" font-style="italic" text-anchor="start" font-weight="normal" fill="#2e2a24">shellac: resin secreted by the female lac bug</text>
<text x="70" y="1102" font-family="Georgia, serif" font-size="20" text-anchor="start" font-weight="normal" fill="#2e2a24">D · From the 16th century, “sealing wax”</text>
<text x="70" y="1127" font-family="Georgia, serif" font-size="20" text-anchor="start" font-weight="normal" fill="#2e2a24">is mostly insect resin and mineral red. Discuss.</text>
