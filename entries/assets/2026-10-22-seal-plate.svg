<text x="70" y="74" font-family="Georgia, serif" font-size="46" text-anchor="start" font-weight="bold" fill="#2e2a24">Pressed in Wax: The Seal That Isn’t Wax</text>
<text x="70" y="112" font-family="Georgia, serif" font-size="22" font-style="italic" text-anchor="start" font-weight="normal" fill="#2e2a24">a sphragistics plate — cylinder, signet, pendant seal, recipe, colour code, and the break · seed 20261022</text>
<rect x="70" y="150" width="480" height="430" fill="none" stroke="#2e2a24" stroke-width="2.5"/>
<rect x="78" y="158" width="464" height="414" fill="none" stroke="#2e2a24" stroke-width="1" opacity="0.5"/>
<text x="92" y="188" font-family="Georgia, serif" font-size="25" text-anchor="start" font-weight="bold" fill="#2e2a24">A · Roll, Don’t Stamp</text>
